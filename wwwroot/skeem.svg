<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff" stroke="#999"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">XML skeem (test.xsd): sugupuu</text>

  <!-- inimene -->
  <rect x="40" y="170" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="196" text-anchor="middle" font-weight="bold">inimene</text>
  <text x="115" y="216" text-anchor="middle" font-size="12">inimeneTyyp</text>

  <!-- synd attribute -->
  <rect x="270" y="60" width="170" height="50" rx="25" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="355" y="82" text-anchor="middle">@synd</text>
  <text x="355" y="100" text-anchor="middle" font-size="12">xs:gYear, kohustuslik</text>

  <!-- nimi -->
  <rect x="270" y="165" width="170" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="187" text-anchor="middle" font-weight="bold">nimi</text>
  <text x="355" y="205" text-anchor="middle" font-size="12">xs:string, 1 kord</text>

  <!-- lapsed -->
  <rect x="270" y="270" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="296" text-anchor="middle" font-weight="bold">lapsed</text>
  <text x="355" y="316" text-anchor="middle" font-size="12">lapsedTyyp, 0..1 (valikuline)</text>

  <!-- inimene (child) -->
  <rect x="540" y="270" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="625" y="296" text-anchor="middle" font-weight="bold">inimene</text>
  <text x="625" y="316" text-anchor="middle" font-size="12">1..mitu (unbounded)</text>

  <!-- arrows -->
  <path d="M190 185 L270 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M190 200 L270 190" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M190 215 L270 295" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440 300 L540 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- recursion -->
  <path d="M625 330 L625 375 L115 375 L115 230" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="370" y="400" text-anchor="middle" fill="#dc2626" font-size="13">rekursioon: laps on samuti inimene (sama tüüp)</text>

  <!-- legend -->
  <text x="40" y="60" font-size="12" fill="#555">Legend:</text>
  <text x="40" y="78" font-size="12" fill="#555">sinine = element inimene</text>
  <text x="40" y="94" font-size="12" fill="#555">roheline = alamelement</text>
  <text x="40" y="110" font-size="12" fill="#555">kollane = atribuut</text>
</svg>
